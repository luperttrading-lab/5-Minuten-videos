<title>{{TITEL}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="{{BESCHREIBUNG}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Literata:opsz,wght@7..72,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* Vorlage für Hörproben (werkzeug/hoerprobe.py, übernommen aus seneca-audio/seite). Layout: eine Spalte, je Stelle eine Tafel mit Abspielknopf, Text zum Mitlesen, Befund und Vorschlag. Dunkel wie das Video:
     Bronze heißt „wo bin ich / worauf achten“, Weiß und Grau sind der Sprechtext. */
  :root {
    --stein: #161a19; --tafel: #1e2422; --tafel-hoch: #252c2a; --tinte: #e9edeb; --grau: #939e99; --linie: #333b38; --bronze: #d29f62;
    --rot: rgba(226, 84, 70, .45); --rot-voll: #c9483b;
    --blau: rgba(92, 146, 240, .45); --blau-voll: #8fb4ff; --gruen: rgba(78, 186, 112, .42); --gruen-voll: #7fd69a;
    --display: "Cinzel", Georgia, serif; --text: "Literata", Georgia, serif; --ui: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--stein); color: var(--tinte); font: 16px/1.5 var(--ui); }
  main { max-width: 560px; margin: 0 auto; display: grid; gap: 20px;
    padding-block: 32px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .kopf { display: grid; gap: 6px; text-align: center; }
  .eyebrow { font: 600 12px/1.3 var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--bronze); }
  h1 { margin: 0; font: 600 clamp(26px, 7.5vw, 36px)/1.15 var(--display); letter-spacing: .03em; text-wrap: balance; }
  .lead { margin: 0; color: var(--grau); font-size: 15px; }
  .stelle { display: grid; gap: 14px; padding: 16px; border: 1px solid var(--linie); border-radius: 16px; background: var(--tafel); }
  .stelle[data-an="true"] { border-color: var(--bronze); background: var(--tafel-hoch); }
  .zeile { display: flex; align-items: center; gap: 14px; }
  .knopf { flex: 0 0 auto; width: 56px; height: 56px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer;
    background: var(--bronze); color: var(--stein); touch-action: manipulation; }
  .knopf:focus-visible { outline: 2px solid var(--tinte); outline-offset: 3px; }
  .knopf svg { width: 26px; height: 26px; }
  .titel { display: grid; gap: 2px; min-width: 0; }
  .titel b { font: 600 17px/1.3 var(--ui); }
  .titel span { font-size: 14px; color: var(--grau); font-variant-numeric: tabular-nums; }
  .text { margin: 0; font: 400 19px/1.6 var(--text); }
  .w { color: transparent; -webkit-background-clip: text; background-clip: text;
    background-image: linear-gradient(90deg, var(--tinte) calc(var(--f, 0) * (100% + 1em) - 1em), var(--grau) calc(var(--f, 0) * (100% + 1em))); }
  .w.vorbei { --f: 1; }
  .w.verdacht { text-decoration: underline wavy var(--bronze); text-decoration-thickness: 1.5px; text-underline-offset: 5px; }
  .balken { height: 4px; border-radius: 2px; background: var(--linie); overflow: hidden; }
  .balken i { display: block; height: 100%; width: 0; background: var(--bronze); }
  dl { margin: 0; display: grid; gap: 8px; }
  dt { font: 600 12px/1.3 var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--bronze); }
  dd { margin: 0; font-size: 15px; color: var(--tinte); }
  dd em { font-family: var(--text); }
  .fuss { margin: 0; font-size: 14px; color: var(--grau); }
  .befund { display: grid; gap: 10px; }
  .befund p { margin: 0; font-size: 15px; }
  .befund table { width: 100%; border-collapse: collapse; font-size: 15px; }
  .befund th, .befund td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--linie); vertical-align: top; }
  .befund th { font: 600 12px/1.3 var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--bronze); }
  .befund td:last-child { min-width: 7em; }
  .abschnitt { margin: 8px 0 -6px; font: 600 13px/1.3 var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--bronze); }
  .w { cursor: pointer; }   /* Tippen auf ein Wort spielt ab dieser Stelle */
  /* Feste Leiste unten: Abspielen, Spulen, Zeit für die Tafel, die gerade läuft */
  .leiste { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--tafel-hoch); border-top: 1px solid var(--linie);
    padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .leiste-innen { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .leiste-kopf { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 34px; font-size: 13px; color: var(--grau); }
  .leiste .zeit { flex: 0 0 auto; font-size: 12px; color: var(--grau); font-variant-numeric: tabular-nums; }
  .leiste-kopf b { color: var(--bronze); font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .leiste-knoepfe { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .leiste button { border: 0; background: none; color: var(--tinte); font: 600 14px/1 var(--ui); cursor: pointer; padding: 8px 6px; touch-action: manipulation; }
  .leiste button:focus-visible, .leiste input:focus-visible { outline: 2px solid var(--bronze); outline-offset: 2px; }
  .leiste .haupt { width: 44px; height: 44px; border-radius: 50%; background: var(--bronze); color: var(--stein); display: grid; place-items: center; padding: 0; }
  .leiste .haupt svg { width: 22px; height: 22px; }
  .leiste input[type=range] { flex: 1 1 auto; min-width: 0; accent-color: var(--bronze); height: 28px; }
  main.mit-leiste { padding-bottom: calc(170px + env(safe-area-inset-bottom, 0px)); }
  /* Markieren: Textmarker als box-shadow, weil der Hintergrund der Wörter für die Lauffarbe auf den Text beschnitten ist.
     Drei Stände je Stelle: markiert (rot), abgeschickt (blau, Häkchen), korrigiert (grün, „neu“). */
  .w.m-markiert, .w.m-abgeschickt, .w.m-korrigiert { box-shadow: inset 0 -1.05em 0 var(--rot); border-radius: 2px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .w.m-abgeschickt { box-shadow: inset 0 -1.05em 0 var(--blau); }
  .w.m-korrigiert { box-shadow: inset 0 -1.05em 0 var(--gruen); }
  .w.m-ende::after { font: 600 11px/1 var(--ui); letter-spacing: .04em; margin-left: 3px; vertical-align: 2px; padding: 2px 5px; border-radius: 999px; }
  .w.m-ende.m-abgeschickt::after { content: "✓"; color: #0f1a2e; background: var(--blau-voll); }
  .w.m-ende.m-korrigiert::after { content: "neu"; color: #0d2214; background: var(--gruen-voll); }
  .markier-an .w { cursor: crosshair; }
  .leiste.markier-an { border-top-color: var(--rot-voll); }
  .leiste .stift { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; border: 1px solid var(--linie); border-radius: 999px; padding: 6px 12px; white-space: nowrap; }
  .leiste .stift[hidden] { display: none; }
  .leiste .stift[aria-pressed="true"] { background: var(--rot-voll); border-color: var(--rot-voll); color: #fff; }
  .leiste .stift svg { width: 16px; height: 16px; }
  .leiste .zaehler { flex: 0 0 auto; white-space: nowrap; margin-left: auto; padding: 8px 2px; font: 500 13px/1 var(--ui); color: var(--grau); }
  .leiste .zaehler[hidden] { display: none; }
  /* Notiz und Meldungen schweben über der Leiste: die Leiste behält ihre Höhe, der Text springt nicht */
  html { overflow-anchor: none; }
  .schwebe { position: absolute; left: 0; right: 0; bottom: 100%; display: grid; gap: 6px; pointer-events: none;
    padding: 0 max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
  .schwebe > * { max-width: 560px; width: 100%; margin: 0 auto; pointer-events: auto; }
  .notiz { display: grid; gap: 8px; min-width: 0; padding: 12px 14px; border: 2px solid var(--bronze); border-radius: 14px; background: #f6efe3; color: #1d2321; box-shadow: 0 -6px 24px rgba(0, 0, 0, .55); }
  .notiz[hidden] { display: none; }
  .notiz-kopf { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; color: #5d6662; min-width: 0; }
  .notiz-kopf span { flex: 0 0 auto; }
  .notiz-kopf b { flex: 1 1 auto; color: #1d2321; font: 400 15px/1.3 var(--text); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .notiz-zeile { display: flex; gap: 8px; align-items: center; min-width: 0; }
  .notiz input { flex: 1 1 auto; min-width: 0; font: 17px/1.3 var(--ui); color: #1d2321; background: #fff; border: 2px solid #b9a789; border-radius: 10px; padding: 11px 12px; }
  .notiz input::placeholder { color: #8a8f8c; }
  .notiz input:focus { outline: none; border-color: var(--bronze); }
  .leiste .notiz .senden { flex: 0 0 auto; background: var(--bronze); color: var(--stein); border-radius: 8px; padding: 9px 12px; }
  .leiste .notiz .senden:disabled { background: #d9d2c5; color: #8a8f8c; cursor: default; }
  .leiste .notiz .zu { flex: 0 0 auto; padding: 4px 6px; color: #5d6662; font-size: 16px; border-radius: 8px; }
  .leiste .notiz .zu.sicher { background: var(--rot-voll); color: #fff; font-size: 14px; padding: 6px 10px; }
  .antwort { margin: 0; font-size: 14px; color: var(--gruen-voll); }
  .meldung { font-size: 13px; padding: 6px 10px; border-radius: 8px; background: #23332a; color: #bfe8cb; box-shadow: 0 -4px 12px rgba(0, 0, 0, .4); }
  .meldung.fehler { background: #3a1f1c; color: #ffb4aa; font-weight: 600; }
  .meldung[hidden] { display: none; }
  /* Übersicht der Stellen oben auf der Seite */
  .marken { display: grid; gap: 10px; padding: 14px 16px; border: 1px solid var(--linie); border-radius: 16px; background: var(--tafel); }
  .marken[hidden] { display: none; }
  .marken h2 { margin: 0; font: 600 13px/1.3 var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--bronze); }
  .marken ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .marken li { display: flex; gap: 10px; align-items: flex-start; padding: 10px; border-radius: 10px; background: var(--stein); cursor: pointer; }
  .marken li .inhalt { display: grid; gap: 3px; min-width: 0; flex: 1 1 auto; }
  .marken li q { font: 400 16px/1.35 var(--text); quotes: "„" "“"; }
  .marken li small { font-size: 13px; color: var(--grau); }
  .marken li .n { font-size: 14px; color: var(--tinte); }
  .marken li .abspielen { flex: 0 0 auto; width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--tafel-hoch); color: var(--bronze); display: grid; place-items: center; cursor: pointer; }
  .marken li .abspielen svg { width: 18px; height: 18px; }
  .stand { display: inline-block; font: 600 11px/1.4 var(--ui); letter-spacing: .06em; text-transform: uppercase; padding: 1px 7px; border-radius: 999px; }
  .stand.markiert { background: var(--rot-voll); color: #fff; }
  .stand.abgeschickt { background: var(--blau-voll); color: #0f1a2e; }
  .stand.korrigiert { background: var(--gruen-voll); color: #0d2214; }
  .stand.verwaist { background: var(--linie); color: var(--tinte); }
  @media (prefers-reduced-motion: reduce) { .w { transition: none; } }
</style>

<main class="mit-leiste">
{{INHALT}}
  <audio id="ton" preload="auto"></audio>
</main>
<div class="leiste" id="leiste">
  <div class="schwebe">
    <div class="meldung" id="meldung" role="status" aria-live="polite" hidden></div>
    <div class="notiz" id="notiz" hidden>
      <div class="notiz-kopf"><b id="notiz-wo"></b><span id="notiz-stand"></span><button type="button" class="zu" id="notiz-weg" aria-label="Markierung löschen">✕</button></div>
      <p class="antwort" id="notiz-antwort" hidden></p>
      <div class="notiz-zeile">
        <input type="text" id="notiz-text" placeholder="Was ist dir aufgefallen? (z. B. Betonung auf …)" aria-label="Notiz zur markierten Stelle" enterkeyhint="send">
        <button type="button" class="senden" id="notiz-ok" disabled>Abschicken</button>
      </div>
    </div>
  </div>
  <div class="leiste-innen">
    <div class="leiste-kopf"><b id="leiste-name">Tippe auf ▶ oder auf ein Wort</b><button type="button" class="zaehler" id="zaehler" aria-label="Zu deinen Stellen" hidden></button><button type="button" class="stift" id="stift" aria-pressed="false" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15.2 3.3a2 2 0 0 1 2.8 0l2.7 2.7a2 2 0 0 1 0 2.8L9.4 20.1 3 21l.9-6.4z"/></svg><span id="stift-text">Markieren</span></button></div>
    <div class="leiste-knoepfe">
      <button type="button" id="zurueck" aria-label="10 Sekunden zurück">−10</button>
      <button type="button" class="haupt" id="haupt" aria-label="Abspielen"></button>
      <button type="button" id="vor" aria-label="10 Sekunden vor">+10</button>
      <input type="range" id="regler" min="0" max="1" step="0.1" value="0" aria-label="Stelle im Abschnitt">
      <span class="zeit" id="leiste-zeit">0:00</span>
    </div>
  </div>
</div>

<script>
(function () {
  var S = {{DATEN}}, KAP = {{KAPITEL}};
  var PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5.5v13a1 1 0 0 0 1.5.86l10.2-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';
  var PAUSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>';
  var ton = document.getElementById("ton"), aktiv = null, spans = {};
  Object.keys(S).forEach(function (k) {
    var p = document.querySelector('[data-text="' + k + '"]'); spans[k] = [];
    S[k].w.forEach(function (x, i) {
      if (i) p.appendChild(document.createTextNode(" "));
      var s = document.createElement("span"); s.className = "w" + (S[k].mark.indexOf(i) >= 0 ? " verdacht" : ""); s.textContent = x.w;
      p.appendChild(s); spans[k].push(s);
    });
  });
  function zeichne() {
    document.querySelectorAll(".knopf").forEach(function (b) {
      var k = b.dataset.k, spielt = k === aktiv && !ton.paused;
      b.innerHTML = spielt ? PAUSE : PLAY; b.setAttribute("aria-label", (b.dataset.name || "Stelle " + k.slice(1)) + (spielt ? " anhalten" : " abspielen"));
      document.getElementById(k).dataset.an = String(k === aktiv);
    });
  }
  function fuelle(k, t) {
    var W = S[k].w, i = -1;
    while (i + 1 < W.length && W[i + 1].t <= t + 0.03) i++;
    spans[k].forEach(function (s, j) { s.classList.toggle("vorbei", j < i); if (j !== i) s.style.removeProperty("--f"); });
    if (i >= 0) {
      var t0 = W[i].t, t1 = i + 1 < W.length ? W[i + 1].t : S[k].dauer, e = Math.min(t1, t0 + 0.08 + 0.07 * W[i].w.length);
      spans[k][i].style.setProperty("--f", Math.max(0, Math.min(1, (t - t0) / Math.max(0.05, e - t0))).toFixed(3));
    }
    document.querySelector('[data-balken="' + k + '"]').style.width = (100 * Math.min(1, t / S[k].dauer)) + "%";
  }
  function zuruecksetzen(k) { fuelle(k, -1); document.querySelector('[data-balken="' + k + '"]').style.width = "0"; }
  var leiste = document.getElementById("leiste"), haupt = document.getElementById("haupt"), regler = document.getElementById("regler"), ziehen = false;
  var mm = function (x) { x = Math.max(0, x || 0); return Math.floor(x / 60) + ":" + ("0" + Math.floor(x % 60)).slice(-2); };
  function name(k) { var b = document.querySelector('.knopf[data-k="' + k + '"]'); return b ? b.dataset.name : ""; }
  // Tafel k ab Sekunde t abspielen; eine neue Quelle erst nach dem Laden der Metadaten auf t setzen
  function starte(k, t) {
    if (k !== aktiv) {
      if (aktiv) zuruecksetzen(aktiv);
      aktiv = k; ton.src = S[k].datei || ("audio/stelle" + k.slice(1) + ".mp3");
      ton.addEventListener("loadedmetadata", function los() { ton.removeEventListener("loadedmetadata", los); ton.currentTime = t; ton.play().catch(function () {}); });
      ton.load();
      document.getElementById("leiste-name").textContent = name(k); regler.max = S[k].dauer;
    } else { ton.currentTime = t; ton.play().catch(function () {}); }
    zeichne();
  }
  document.querySelectorAll(".knopf").forEach(function (b) {
    b.addEventListener("click", function () {
      var k = b.dataset.k;
      if (k === aktiv) { if (ton.paused) { if (ton.ended) ton.currentTime = 0; ton.play().catch(function () {}); } else ton.pause(); return; }
      starte(k, 0);
    });
  });
  // Tippen auf ein Wort: ab diesem Wort abspielen; im Markier-Modus markieren bzw. die Stelle öffnen (nie still löschen)
  Object.keys(spans).forEach(function (k) {
    spans[k].forEach(function (s, i) {
      var halt = null, lang = false;
      s.addEventListener("pointerdown", function () { lang = false; clearTimeout(halt);
        halt = setTimeout(function () { if (!db || gewischt) return; lang = true; if (!markieren) stift.click(); sperre = Date.now() + 350; anker = s; tippe(k, i); }, 550); });
      ["pointerup", "pointerleave", "pointercancel"].forEach(function (ev) { s.addEventListener(ev, function () { clearTimeout(halt); }); });
      s.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      s.addEventListener("click", function () {
      if (lang) { lang = false; return; }   // langer Druck hat schon markiert
      if (!markieren) { starte(k, Math.max(0, S[k].w[i].t - 0.05)); return; }
      if (gewischt || Date.now() < sperre) return;   // nach Wischen oder direkt nach einem Tipp nicht markieren
      sperre = Date.now() + 350; anker = s; tippe(k, i);
    }); });
  });
  document.head.insertAdjacentHTML("beforeend", "<style>.w { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }</style>");
  // Ein Tipp zählt nur, wenn der Finger nicht gewischt hat (Bewegung oder Scrollen zwischen Berühren und Loslassen)
  var sperre = 0, gewischt = false, anker = null, beruehrt = null;
  document.addEventListener("touchstart", function (e) { var t = e.touches[0]; beruehrt = { x: t.clientX, y: t.clientY, s: scrollY }; gewischt = false; }, { passive: true });
  document.addEventListener("touchmove", function (e) { var t = e.touches[0]; if (beruehrt && (Math.abs(t.clientX - beruehrt.x) > 10 || Math.abs(t.clientY - beruehrt.y) > 10)) gewischt = true; }, { passive: true });
  document.addEventListener("touchend", function () { if (beruehrt && Math.abs(scrollY - beruehrt.s) > 2) gewischt = true; }, { passive: true });
  haupt.addEventListener("click", function () { if (!aktiv) { starte("ganz", 0); return; } if (ton.paused) { if (ton.ended) ton.currentTime = 0; ton.play().catch(function () {}); } else ton.pause(); });

  // Markierungen: Speicher der Seite, Sammlung „markierungen“, ein Eintrag je Wort (kapitel, wort, satz, wortnr, zeit,
  // tafel, notiz, stand; dazu status, antwort, fassung, wenn Claude eine Stelle neu gesprochen hat). Benachbarte Wörter
  // (oder mit einem Wort dazwischen im selben Satz) bilden eine Stelle. Stand einer Stelle: korrigiert, wenn alle Wörter
  // status „korrigiert“ haben; sonst abgeschickt, wenn eines der übrigen eine Notiz hat; sonst markiert.
  // Wörter werden über satz + wort im Text gesucht (wortnr nur als Hinweis), weil sich Nummern bei Neuaufnahmen verschieben;
  // hat Claude den Wortlaut geändert, stehen satz_neu/wort_neu im Eintrag. Nicht mehr auffindbare Einträge stehen nur in der Liste.
  var db = null, markieren = false, marken = {}, stellen = [], ortVon = {}, offen = null, entwurf = {}, wegSicher = false;
  var zaehler = document.getElementById("zaehler"), stift = document.getElementById("stift"), notiz = document.getElementById("notiz"), notizText = document.getElementById("notiz-text");
  var notizOk = document.getElementById("notiz-ok"), notizWeg = document.getElementById("notiz-weg"), meldung = document.getElementById("meldung");
  var G = S.ganz && S.ganz.i0 === 0 ? S.ganz.w : null;   // Wörter des ganzen Kapitels
  var ENDE = /[.;:?!][“”"]?$/;
  function norm(x) { return String(x || "").toLowerCase().replace(/[^\p{L}\p{N}]+/gu, " ").trim(); }
  function satzGrenzen(W, i) { var a = i, e = i; while (a > 0 && !ENDE.test(W[a - 1].w)) a--; while (e < W.length - 1 && !ENDE.test(W[e].w)) e++; return [a, e]; }
  function satzText(W, i) { var g = satzGrenzen(W, i); return W.slice(g[0], g[1] + 1).map(function (x) { return x.w; }).join(" "); }
  function satz(k, i) { return satzText(S[k].w, i); }
  function raumW(r) { return r === "K" ? G : (S[r] ? S[r].w : null); }
  // Ort eines Eintrags: {r: "K" (Kapitel) oder Tafel, i: Wortnummer darin} oder null
  function finde(d, id) {
    var wort = norm(d.wort_neu || d.wort), sz = norm(d.satz_neu || d.satz), hin = d.wortnr_neu != null ? d.wortnr_neu : d.wortnr;
